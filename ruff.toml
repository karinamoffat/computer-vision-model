line-length = 120
# Colab notebooks: cell-scoped imports and shell magics do not follow module rules
exclude = ["*.ipynb"]

[lint]
# D: docstrings, I: import order, UP: pyupgrade
select = ["E", "F", "W", "D", "I", "UP"]
ignore = [
    "E501",  # long lines are common in the argparse/plot blocks
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D401",  # imperative-mood nitpicking
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"conftest.py" = ["E402", "D100"]
"tests/*" = ["D100", "D103", "D105", "D107"]
